<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquadHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <nav class="nav">
      <button class="btn btn-outline">INFORMAÇÕES TÉCNICAS</button>
      <button class="btn btn-outline">ENTRAR</button>
    </nav>
  </header>

  <main class="main">
    <section class="hero">
      <img src="Assets/img/SquadHub Logo.png" alt="Logo SquadHub" class="logo">
      <h2 class="subtitulo">SUA PRÓXIMA PARTIDA<br>COMEÇA AQUI!</h2>
      <p class="descricao">
        Hub para jogadores encontrarem outras pessoas para jogar, seja para formar
        equipes ou enfrentar outros players.
      </p>
      <ul class="status">
        <li><span class="bolinha"></span> 1.284 jogadores online</li>
        <li><span class="bolinha"></span> 247 lobbies disponíveis agora</li>
      </ul>
    </section>

    <section class="acao">
      <h3 class="acao-titulo">COMECE <span class="destaque">A JOGAR!</span></h3>
      <p class="acao-texto">Encontre seu squad ou crie um lobby e chame seus amigos</p>
      <button class="btn btn-preenchido">ENCONTRE SEU LOBBY</button>
      <button class="btn btn-borda">CRIAR UM NOVO LOBBY &rarr;</button>
    </section>
  </main>

</body>
</html>
