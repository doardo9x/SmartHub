<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS do cadastro -->
    <link rel="stylesheet" href="../../css/cadastro.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Cadastro - SquadHub</title>
</head>


<body>

    <main class="pagina-cadastro">
        <nav class="menu-topo">

            <div class="menu-esquerda"></div>

            <div class="menu-links">

                <a href="../../pages/InformacoesTecnicas/InformacoesTecnicas.html" class="botao-menu">
                    INFORMAÇÕES TÉCNICAS
                </a>

                <a href="login.html" class="botao-menu botao-entrar">
                    ENTRAR
                </a>

            </div>

        </nav>

        <div class="cadastro-container">

            <section class="cadastro-apresentacao">

                <div class="cadastro-texto">

                    <h1>
                        BEM-VINDO AO
                        <span>SQUADHUB</span>
                    </h1>

                    <p>
                        ENCONTRE JOGADORES, FORME SQUAD<br>
                        E EVOLUA NO JOGO.
                    </p>

                </div>

                <div class="logo-container">
                    <img src="../../img/SquadHub Logo.png" alt="Logo SquadHub" class="logo-squadhub">
                </div>

            </section>


            <section class="cadastro-formulario">

                <form class="formulario" onsubmit="window.location.href='../RetornoCadastro/RetornoCadastro.html'; return false;">

                    <div class="formulario-titulo">

                        <h2>
                            CRIE SUA
                            <span>CONTA</span>
                        </h2>

                        <p>
                            DE O PRIMEIRO PASSO PARA FAZER PARTE DO SQUADHUB
                        </p>

                    </div>


                    <div class="campo">

                        <label for="usuario">
                            <img src="Assets/img/person.svg" alt="">
                            NOME DE USUÁRIO
                        </label>

                        <input type="text" id="usuario" name="usuario" placeholder="DIGITE SEU NOME DE USUÁRIO" required>

                    </div>


                    <div class="campo">

                        <label for="email">
                            <img src="Assets/img/mail.svg" alt="">
                            EMAIL
                        </label>

                        <input type="email" id="email" name="email" placeholder="DIGITE SEU EMAIL" required>

                    </div>


                    <div class="campo">

                        <label for="senha">
                            <img src="Assets/img/lock.svg" alt="">
                            SENHA
                        </label>

                        <input type="password" id="senha" name="senha" placeholder="DIGITE SUA SENHA" required>

                    </div>


                    <div class="campo">

                        <label for="confirmar-senha">
                            <img src="Assets/img/lock.svg" alt="">
                            CONFIRMAR SENHA
                        </label>

                        <input type="password" id="confirmar-senha" name="confirmar-senha"
                            placeholder="CONFIRME SUA SENHA" required>

                    </div>


                    <label class="termos">

                        <input type="checkbox" required>

                        EU ACEITO OS TERMOS DE USO E A POLÍTICA DE PRIVACIDADE.

                    </label>


                    <button type="submit" class="botao-cadastro">

                        CRIAR CONTA

                        <span class="seta">→</span>

                    </button>

                </form>

            </section>

        </div>

    </main>

</body>

</html>
